<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon: SVG pra navegadores modernos (nítido em qualquer tamanho/tela),
         ICO como fallback universal (Safari antigo, bookmarks do Windows). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <title>Pyrra - Foco, treino, finanças e hábitos num só lugar</title>
    <meta
      name="description"
      content="Pyrra é o app que organiza sua rotina: hábitos com streak, treino e nutrição, tarefas, finanças e um assistente de IA (Zelo) que monta seus planos automaticamente."
    />
    <link rel="canonical" href="https://www.pyrra.com.br/" />

    <!-- Open Graph: como o link aparece ao compartilhar (WhatsApp, Slack, redes sociais) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.pyrra.com.br/" />
    <meta property="og:site_name" content="Pyrra" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Pyrra — Foco, treino, finanças e hábitos num só lugar" />
    <meta
      property="og:description"
      content="Organize hábitos, treino, nutrição, tarefas e finanças num só app — com um assistente de IA que monta seus planos automaticamente."
    />
    <meta property="og:image" content="https://www.pyrra.com.br/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo do Pyrra" />

    <!-- Twitter/X usa suas próprias tags em vez das Open Graph -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pyrra — Foco, treino, finanças e hábitos num só lugar" />
    <meta
      name="twitter:description"
      content="Organize hábitos, treino, nutrição, tarefas e finanças num só app — com um assistente de IA que monta seus planos automaticamente."
    />
    <meta name="twitter:image" content="https://www.pyrra.com.br/og-image.png" />

    <!-- Google Analytics 4 (só pageview padrão, sem eventos customizados). O Measurement ID vem
         de VITE_GA_MEASUREMENT_ID — Vite substitui %VITE_GA_MEASUREMENT_ID% pelo valor da env var
         em build/dev (ver .env). Sem banner de consentimento por enquanto (decisão consciente,
         fica pra quando a página de privacidade for separada dos Termos). -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA_MEASUREMENT_ID%"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', '%VITE_GA_MEASUREMENT_ID%');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
